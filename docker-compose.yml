services:
  # ── MongoDB ──
  mongo:
    image: mongo:7
    container_name: pilgrim-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  # ── Express API (port 8080) ──
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: pilgrim-api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongo:27017/pilgrim-protect
      - JWT_SECRET=pilgrim-protect-dev-secret-key-2026
      - JWT_EXPIRE=30d
      - CLIENT_URL=http://localhost:3001
    depends_on:
      - mongo
    restart: unless-stopped

  # ── Next.js Website (port 3000) ──
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: pilgrim-web-3001
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://127.0.0.1:8080/api/v1
      - API_URL=http://api:8080/api/v1
      - NEXT_PUBLIC_MOCK=false
      - NEXT_PUBLIC_MAPBOX_TOKEN=${MAPBOX_TOKEN:-pk.eyJ1IjoianR1cmFnYXZvdSIsImEiOiJjbTYxcWQ5N3gwcWJ0MmxwcnVtMzA2N3hpIn0.M7Ze88QM1F68YwQkBv2hvw}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mongo-data:
